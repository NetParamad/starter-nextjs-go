name: Template CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check OpenAPI contract drift
        run: npm run check:contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:strict

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend

      - name: Tests
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Security scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install root dependencies
        run: npm ci

      - name: Lint workflows
        run: npm run check:workflows

      - name: Secret scan
        run: npm run check:secrets

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: template-nextjs-go-backend:test

      - name: Build frontend container
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: template-nextjs-go-frontend:test

      - name: Scan backend container with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: template-nextjs-go-backend:test
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Scan frontend container with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: template-nextjs-go-frontend:test
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Generate SBOM for backend
        uses: anchore/sbom-action@v0
        with:
          image: template-nextjs-go-backend:test
          artifact-name: backend-sbom.spdx.json

      - name: Generate SBOM for frontend
        uses: anchore/sbom-action@v0
        with:
          image: template-nextjs-go-frontend:test
          artifact-name: frontend-sbom.spdx.json
