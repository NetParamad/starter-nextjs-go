apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: template-app
  labels:
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: web-frontend
