apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-backend-pdb
  namespace: template-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-frontend-pdb
  namespace: template-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-frontend
