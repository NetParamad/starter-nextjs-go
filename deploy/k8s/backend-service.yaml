apiVersion: v1
kind: Service
metadata:
  name: api-backend
  namespace: template-app
  labels:
    app.kubernetes.io/name: api-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: api-backend
