services:
  postgres:
    image: postgres:17-alpine
    container_name: template-nextjs-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - template-nextjs-go-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.0
    container_name: template-nextjs-go-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: db_password
      DB_HOST: postgres
      DB_NAME: app_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # Full-stack profile for prod-like local runs:
  # docker compose --profile prod up --build
  backend:
    build: ./backend
    profiles: ["prod"]
    container_name: template-nextjs-go-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DB_HOST: postgres
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_DEMO_EMAIL: ${DEMO_USER_EMAIL:-demo@nextjs-go.local}
        NEXT_PUBLIC_DEMO_PASSWORD: ${DEMO_USER_PASSWORD:-demo12345}
    profiles: ["prod"]
    container_name: template-nextjs-go-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  template-nextjs-go-postgres-data:
